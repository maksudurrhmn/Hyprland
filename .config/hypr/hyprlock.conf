# CURRENT SONG
image {
    monitor =
    path = /tmp/nowplaying/hypr/album_art.webp
    onclick = ~/.config/hyprlock/scripts/nowplaying.sh --toggle-pause
    border_size = 0
    border_color = rgba(0, 0, 0, 0)
    size = 80
    rounding = 14
    rotate = 0
    reload_time = 1
    reload_cmd = 
    position = 30, 140
    halign = left
    valign = bottom
    zindex = 1
}

label {
    monitor =
    text = cmd[update:1000] ~/.config/hyprlock/scripts/nowplaying.sh
    color =  $lock-text
    font_size = 11
    font_family = JetBrainsMono Nerd Font
    position = 30, 65
    halign = left
    valign = bottom
    zindex = 1
}


# PREVIOUS SONG
label {
    monitor =
    text = cmd[update:0:true] ~/.config/hyprlock/scripts/nowplaying.sh --get-previous-btn
    color = $lock-accent
    font_size = 18
    position = 30, 30
    halign = left
    valign = bottom
    zindex = 1
    onclick = ~/.config/hypr/hyprlock/nowplaying/nowplaying.sh --previous
}

# PLAY/PAUSE TOGGLE
label {
    monitor =
    text = cmd[update:0:true] ~/.config/hyprlock/scripts/nowplaying.sh --get-toggle-btn
    color = $lock-accent
    font_size = 18
    position = 70, 30
    halign = left
    valign = bottom
    zindex = 1
    onclick = ~/.config/hyprlock/scripts/nowplaying.sh --toggle-pause
}

# NEXT SONG
label {
    monitor =
    text = cmd[update:0:true] ~/.config/hyprlock/scripts/nowplaying.sh --get-next-btn
    color = $lock-accent
    font_size = 18
    position = 110, 30
    halign = left
    valign = bottom
    zindex = 1
    onclick = ~/.config/hyprlock/scripts/nowplaying.sh --next
}
