source = ~/.config/hypr/hyprlock-colors.conf
# File path ~/.config/hypr/hyprlock.conf
# Clean, minimal lock screen — background image, clock, simple input field

# Genaral
general {
    # disable_loading_bar = true
    # grace = 0
    hide_cursor = false
    # no_fade_in = false
}

# Animation
animations {
    enabled = true
    bezier = linear, 1, 1, 0, 0
    animation = fadeIn, 1, 3, linear              #Lock Animation
    animation = fadeOut, 1, 3, linear             #Unlock Animation
    animation = inputFieldDots, 1, 2, linear      #InputField Animation
}

# Background Wallpaper
background {
    monitor =
    path = ~/.config/hyprlock/wallpapers/lockscreen.jpg   
    blur_passes = 2
    blur_size = 4
    noise = 0.0117
    contrast = 1.0
    brightness = 0.7
    vibrancy = 0.15
}

# # Personal greeting
# label {
#     monitor =
#     text = cmd[update:60000] ~/.config/hypr/scripts/greeting.sh
#     font_size = 16
#     font_family = JetBrainsMono Nerd Font
#     position = 30, -50
#     halign = left
#     valign = top
# }

# Big centered clock
label {
    monitor =
    text = cmd[update:1000] echo "$(date +'%I:%M%P')"
    color = $lock-accent
    font_size = 96 #Default-96
    font_family = JetBrainsMono Nerd Font Bold
    position = 0, 280
    halign = center
    valign = center
}

# Date, under the clock
label {
    monitor =
    text = cmd[update:60000] echo "$(date +'%A, %d %B')"
    color = $lock-muted
    font_size = 20
    font_family = JetBrainsMono Nerd Font
    position = 0, 180
    halign = center
    valign = center
}

# User profile
image {
    monitor =
    path = ~/.config/hypr/assets/profile.jpg
    size = 120
    rounding = -1
    border_size = 2
    border_color = $lock-border
    position = 0, 0
    halign = center
    valign = center
}

# Username
label {
    monitor =
    text = cmd[update:60000] echo "@$USER"
    font_size = 20
    font_family = JetBrainsMono Nerd Font
    position = 0, -80
    halign = center
    valign = center
}


# Simple minimal input field
input-field {
    monitor =
    size = 260, 55
    outline_thickness = 2
    dots_size = 0.25
    dots_spacing = 0.3
    dots_center = true
    rounding = 20

    outer_color = $lock-border
    inner_color = $lock-surface-transparent
    font_color = $lock-text

    fade_on_empty = true
    placeholder_text = <i>Enter password...</i>
    fail_text = $PAMFAIL$FPRINTFAIL
    hide_input = false

    position = 0, -150
    halign = center
    valign = center
}

# Power options

# SHUTDOWN
label {
    monitor =
    text = <span>  </span>
    color = $lock-accent
    font_size = 22
    position = -30, 30
    halign = right
    valign = bottom
    onclick = ~/.config/hyprlock/scripts/action.sh --shutdown
}

# REBOOT
label {
    monitor =
    text = <span>  </span>
    color = $lock-accent
    font_size = 22
    position = -90, 30
    halign = right
    valign = bottom
    onclick = ~/.config/hyprlock/scripts/action.sh --reboot
}

# SLEEP
label {
    monitor =
    text = <span> 󰤄 </span>
    color = $lock-accent
    font_size = 22
    position = -150, 30
    halign = right
    valign = bottom
    onclick = ~/.config/hyprlock/scripts/action.sh --sleep
}

# CONFIRMATION MESSAGE
label {
    monitor =
    text = cmd[update:0:true] ~/.config/hyprlock/scripts/action.sh --get-message
    color = $lock-success
    font_size = 14
    position = -10, 80  
    halign = right
    valign = bottom
}

# YES BUTTON
label {
    monitor =
    text = cmd[update:0:true] ~/.config/hyprlock/scripts/action.sh --get-yes
    color = $lock-error
    font_size = 22
    position = -280, 20   
    halign = right
    valign = bottom
    onclick = ~/.config/hyprlock/action.sh yes
}

# NO BUTTON
label {
    monitor =
    text = cmd[update:0:true] ~/.config/hyprlock/scripts/action.sh --get-no
    color = $lock-secondary
    font_size = 22
    position = -190, 20   
    halign = right
    valign = bottom
    onclick = ~/.config/hyprlock/scripts/action.sh no
}

