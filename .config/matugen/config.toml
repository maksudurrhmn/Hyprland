[config]
mode = "dark"

[templates.colors]
input_path = "~/.config/matugen/templates/colors.css"
output_path = "~/.config/matugen/colors.css"

[templates.waybar]
input_path = "~/.config/matugen/templates/waybar.css"
output_path = "~/.config/waybar/colors/colors.css"
post_hook = "pkill -SIGUSR2 waybar"

[templates.rofi]
input_path = "~/.config/matugen/templates/rofi.rasi"
output_path = "~/.config/rofi/colors.rasi"

[templates.rofi_wallpaper]
input_path = "~/.config/matugen/templates/rofi-wallpaper.rasi"
output_path = "~/.config/rofi/themes/wallpaper-colors.rasi"

[templates.swaync]
input_path = "~/.config/matugen/templates/swaync.css"
output_path = "~/.config/swaync/colors.css"
post_hook = "swaync-client -rs"

[templates.hyprlock]
input_path = "~/.config/matugen/templates/hyprlock.conf"
output_path = "~/.config/hypr/hyprlock-colors.conf"

[templates.hyprland]
input_path = "~/.config/matugen/templates/hyprland.lua"
output_path = "~/.config/hypr/modules/matugen-colors.lua"
